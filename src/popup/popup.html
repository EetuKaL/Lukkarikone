<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lukkarikoneen ryhmä</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }

      body {
        width: 17rem;
        margin: 0;
        padding: 1rem;
        color: #17212b;
        background: #f4f7f9;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 1.1rem;
      }

      label,
      input,
      button {
        display: block;
      }

      label {
        margin-bottom: 0.4rem;
        font-weight: 600;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        margin-bottom: 0.8rem;
        padding: 0.55rem;
        font: inherit;
        border: 1px solid #aebbc5;
        border-radius: 4px;
      }

      button {
        width: 100%;
        padding: 0.55rem 0.8rem;
        color: #ffffff;
        background: #176b87;
        border: 0;
        border-radius: 4px;
        font: inherit;
        cursor: pointer;
      }

      #status {
        min-height: 1.2rem;
        margin: 0.7rem 0 0;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lukkarikoneen ryhmä</h1>
      <form id="group-form">
        <label for="group-name">Ryhmän nimi</label>
        <input id="group-name" name="groupName" type="text" required autofocus />
        <button type="submit">Tallenna</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
